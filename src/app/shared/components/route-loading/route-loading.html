@if (visible()) {
  <div
    class="fixed inset-0 z-[200] flex items-center justify-center bg-background"
    role="status"
    aria-live="polite"
    data-route-loading
  >
    <img alt="Nexus" class="logo-beat h-16 w-auto" src="/nexus-logo.svg" />
    <span class="sr-only">Loading</span>
  </div>
}
