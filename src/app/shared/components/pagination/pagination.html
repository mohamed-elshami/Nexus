@if (metadata(); as meta) {
  @if (meta.numberOfPages > 1) {
    <div
      class="flex flex-col items-center justify-between gap-space-md rounded-xl bg-surface-container-lowest p-space-md shadow-sm md:flex-row"
    >
      <div class="flex items-center gap-1 text-on-surface">
        <button
          type="button"
          class="flex h-10 items-center gap-1 rounded-lg bg-surface-container-low px-3 text-label-md text-on-surface-variant transition-colors hover:bg-surface-container disabled:opacity-50"
          [disabled]="!canGoPrev()"
          (click)="prev()"
        >
          <span class="material-symbols-outlined text-[18px]">chevron_left</span>
          Prev
        </button>

        @for (page of pages(); track $index) {
          @if (page === 'ellipsis') {
            <span class="w-8 text-center font-bold text-outline">...</span>
          } @else {
            <button
              type="button"
              class="h-10 w-10 rounded-lg text-label-md transition-colors"
              [class.bg-primary]="page === meta.currentPage"
              [class.text-on-primary]="page === meta.currentPage"
              [class.font-bold]="page === meta.currentPage"
              [class.shadow-sm]="page === meta.currentPage"
              [class.text-on-surface-variant]="page !== meta.currentPage"
              [class.hover:bg-surface-container]="page !== meta.currentPage"
              (click)="goTo(page)"
            >
              {{ page }}
            </button>
          }
        }

        <button
          type="button"
          class="flex h-10 items-center gap-1 rounded-lg bg-surface-container-low px-3 text-label-md text-on-surface-variant transition-colors hover:bg-surface-container disabled:opacity-50"
          [disabled]="!canGoNext()"
          (click)="next()"
        >
          Next
          <span class="material-symbols-outlined text-[18px]">chevron_right</span>
        </button>
      </div>

      <div class="flex items-center gap-space-xs text-label-sm text-on-surface-variant">
        <span>Jump to page:</span>
        <input
          type="number"
          class="h-9 w-12 rounded-lg bg-surface-container-low text-center text-label-md font-semibold text-on-surface focus:bg-surface-container focus:outline-none"
          [min]="1"
          [max]="meta.numberOfPages"
          [value]="jumpPage()"
          (input)="jumpPage.set(+$any($event.target).value || 1)"
          (keydown.enter)="jump()"
        />
        <button
          type="button"
          class="h-9 rounded-lg bg-surface-container px-3 text-label-sm font-semibold transition-all hover:bg-primary hover:text-on-primary"
          (click)="jump()"
        >
          Go
        </button>
      </div>
    </div>
  }
}
