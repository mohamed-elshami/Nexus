<div class="container-nexus">
  @if (loading()) {
    <div class="h-80 animate-pulse rounded-xl bg-surface-container"></div>
  } @else if (product(); as item) {
    <div class="relative overflow-hidden rounded-xl bg-surface-container p-space-lg shadow-overlay lg:p-space-xl">
      <div class="pointer-events-none absolute -top-16 -right-16 h-80 w-80 rounded-full bg-secondary-fixed/50 blur-3xl"></div>
      <div class="pointer-events-none absolute -bottom-16 -left-16 h-80 w-80 rounded-full bg-primary-fixed/40 blur-3xl"></div>

      <div class="relative z-10 grid items-center gap-space-lg lg:grid-cols-12">
        <div class="flex flex-col gap-space-md lg:col-span-7">
          <div class="inline-flex items-center gap-space-xs self-start rounded-full bg-error/10 px-space-sm py-1 text-error">
            <span class="material-symbols-outlined text-[16px]">timer</span>
            <span class="text-label-sm font-bold tracking-wider uppercase">Flash Deal of the Day</span>
          </div>
          <div class="flex flex-col gap-space-xs">
            <h2 class="font-display text-headline-lg font-bold tracking-tight text-on-surface">{{ item.title }}</h2>
            <p class="line-clamp-3 max-w-lg text-body-md text-on-surface-variant">{{ item.description }}</p>
          </div>

          <div class="flex items-center gap-space-sm pt-space-xs" aria-label="Time left today">
            <div class="flex h-16 w-16 flex-col items-center justify-center rounded-xl bg-surface-container-lowest shadow-sm">
              <span class="font-display text-headline-md font-bold text-on-surface">{{ pad(hours()) }}</span>
              <span class="text-[10px] font-medium text-on-surface-variant uppercase">Hours</span>
            </div>
            <span class="font-display text-headline-sm font-bold text-outline">:</span>
            <div class="flex h-16 w-16 flex-col items-center justify-center rounded-xl bg-surface-container-lowest shadow-sm">
              <span class="font-display text-headline-md font-bold text-on-surface">{{ pad(minutes()) }}</span>
              <span class="text-[10px] font-medium text-on-surface-variant uppercase">Mins</span>
            </div>
            <span class="font-display text-headline-sm font-bold text-outline">:</span>
            <div class="flex h-16 w-16 flex-col items-center justify-center rounded-xl bg-surface-container-lowest shadow-sm">
              <span class="font-display text-headline-md font-bold text-error">{{ pad(seconds()) }}</span>
              <span class="text-[10px] font-medium text-on-surface-variant uppercase">Secs</span>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-space-md pt-space-xs">
            <span class="font-display text-headline-lg font-bold text-on-surface">{{ item.price | number }} EGP</span>
            <a
              class="flex h-12 items-center justify-center gap-space-xs rounded-xl bg-primary px-space-xl text-label-lg text-on-primary shadow-md transition-all hover:scale-[1.02] hover:bg-on-primary-fixed-variant active:scale-[0.98]"
              [routerLink]="['/products', item._id]"
            >
              <span class="material-symbols-outlined text-[20px]">bolt</span>
              <span>Claim Deal Now</span>
            </a>
          </div>
        </div>

        <a class="flex items-center justify-center lg:col-span-5" [routerLink]="['/products', item._id]">
          <span
            class="flex h-72 w-full max-w-md items-center justify-center overflow-hidden rounded-xl bg-surface-container-low p-space-md shadow-modal isolate"
          >
            <img
              class="h-full w-full rounded-xl object-contain mix-blend-multiply transition-transform duration-700 hover:scale-105"
              [src]="item.imageCover"
              [alt]="item.title"
            />
          </span>
        </a>
      </div>
    </div>
  } @else if (error()) {
    <p class="text-body-sm text-error" role="alert">{{ error() }}</p>
  }
</div>
