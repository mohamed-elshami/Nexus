<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Logo Mark -->
  <g transform="translate(10, 8)">
    <rect width="44" height="44" rx="12" fill="#0F172A"/>
    <path d="M14 34V14L30 34V14" stroke="url(#nexusGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="14" cy="14" r="3" fill="#06B6D4"/>
    <circle cx="30" cy="34" r="3" fill="#4F46E5"/>
    <circle cx="22" cy="24" r="2.5" fill="#A855F7"/>
  </g>
  <!-- Wordmark -->
  <text x="66" y="38" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="2.5" fill="#0F172A">NEXUS</text>
  <circle cx="184" cy="24" r="3.5" fill="url(#nexusGrad)"/>
</svg>